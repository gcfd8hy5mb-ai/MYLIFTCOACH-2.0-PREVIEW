name: Deploy MYLIFTCOACH Preview (GitHub Pages only)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: preview-only-pages
  cancel-in-progress: false

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Check out independent preview site
        uses: actions/checkout@v4

      - name: Check out 2.0 development source
        uses: actions/checkout@v4
        with:
          repository: gcfd8hy5mb-ai/MYLIFTCOACH-2.0
          ref: feature/344-approved-exercise-visuals
          path: source-app
          # Source and preview are public repositories; checkout needs no extra secret.
          persist-credentials: false

      - name: Check out isolated Coach candidate
        uses: actions/checkout@v4
        with:
          repository: gcfd8hy5mb-ai/MYLIFTCOACH-2.0
          ref: feature/coach-live-workout-integration-20261122
          path: coach-candidate
          persist-credentials: false

      - name: Validate Coach candidate before packaging
        shell: bash
        run: |
          set -euo pipefail
          test -s coach-candidate/index.html
          test -s coach-candidate/coach-migration.js
          test -s coach-candidate/live-coach-workout.css
          grep -Fq 'liveCoachPreview(plan)' coach-candidate/app.js
          grep -Fq 'liveCoachFeedback(id)' coach-candidate/app.js
          node --check coach-candidate/app.js
          node --test coach-candidate/tests/coach-live-workout.test.cjs

      - name: Source checkout diagnostics
        if: failure()
        shell: bash
        run: |
          echo "::error::MYLIFTCOACH development checkout failed. Both repositories are public. Verify the feature/344-approved-exercise-visuals branch and GitHub Actions access. Stable workout-tracker remains untouched."

      - name: Validate actual approved teal redesign source
        shell: bash
        run: |
          set -euo pipefail
          cd source-app
          test -s index.html
          test -s theme-option-one.css
          test -s coach-program-builder.js
          test -s exercise-catalog-344.js
          test -s assets/myliftcoach-mark.svg
          node --check coach-program-builder.js
          node --check app.js
          node --check custom-workouts.js
          # Keep preview deployment independent of the full development audit.
          # Strictly check the simulation source and its isolation; comprehensive
          # regression suites continue in the source repository CI.
          node --test tests/workout-simulation.test.cjs
          node --test tests/workout-simulation-integration.test.cjs
          node --check workout-simulation-audit.js
          node --check workout-simulation.js
          node --check active-exercise-guide.js
          node --check workouts-tabs-n.js
          grep -Fq 'simulation30' index.html
          grep -Fq 'simulation90' index.html
          grep -Fq 'simulationClear' index.html
          grep -Fq 'coachSimulationNotice' index.html
          grep -Fq 'progressWeeklyComparison' index.html
          node --check progress-weekly-summary.js
          node --check workouts-tabs-n.js
          node --check active-exercise-guide.js
          grep -Fq 'saveCoachDay' custom-workouts.js
          grep -Fq 'custom.find(p=>!p.coachSaved)' weekly-workout-schedule.js
          grep -Fq 'coachSaved:existing?.coachSaved===true' custom-workouts.js
          grep -Fq 'View approved exercise demonstration' app.js
          grep -Fq 'id="approvedMediaStatus"' index.html
          grep -Fq 'onSaveDay:day=>' app.js
          grep -Fq 'theme-option-one.css' index.html
          grep -Fq 'coach-program-builder.js' index.html
          grep -Fq 'id="coaching"' index.html

      - name: Package independent test sites without publishing the live app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/integrated-workout _site/redesign-integrated _site/coach-live-test
          # Keep all pre-existing independent preview pages working.
          rsync -a --exclude=.git --exclude=.github --exclude=_site --exclude=source-app --exclude=redesign-app --exclude=coach-candidate --exclude=node_modules ./ _site/
          rsync -a --exclude=.git --exclude=.github --exclude=tests --exclude=node_modules source-app/ _site/integrated-workout/
          # The approved dark-teal marble redesign is the MYLIFTCOACH-2.0
          # source app. The workout-tracker branch is the old purple UI and
          # must not be used as the visual foundation for this preview.
          rsync -a --exclude=.git --exclude=.github --exclude=tests --exclude=node_modules source-app/ _site/redesign-integrated/
          rsync -a --exclude=.git --exclude=.github --exclude=tests --exclude=node_modules coach-candidate/ _site/coach-live-test/

          # The preview domain has no cloud access, so it cannot modify the
          # live app's Supabase records. Original GitHub Pages is untouched.
          python3 - <<'PY'
          from pathlib import Path
          for name in ('integrated-workout', 'redesign-integrated'):
              page=Path('_site')/name/'index.html'
              html=page.read_text()
              assert '<head>' in html
              policy='<meta http-equiv="Content-Security-Policy" content="connect-src \'none\'; frame-src \'none\'; form-action \'none\'; object-src \'none\'">'
              html=html.replace('<head>','<head>\n'+policy,1)
              if name=='redesign-integrated':
                  assert 'theme-option-one.css' in html
                  assert 'coach-program-builder.js' in html
                  assert 'id="coaching"' in html
                  html=html.replace('<body>','<body>\n<div id="mlc2GuestPreviewNotice" style="position:relative;z-index:99998;background:#082b31;color:#f4d69f;border-bottom:1px solid #c9a96b;padding:9px 12px;text-align:center;font:600 12px system-ui">2.0 APPROVED TEAL REDESIGN · TEST BUILD · CLOUD DISABLED</div>',1)
              if name=='redesign-integrated':
                  assert 'id="simulation30"' in html and 'id="simulation90"' in html
                  html=html.replace('<head>','<head>\n<meta name="mlc2-preview-build" content="simulation-mode-2026-11-22">',1)
              page.write_text(html)
          PY
          # Avoid stale iPhone Safari JavaScript after each Coach integration batch.
          python3 - <<'PYCACHE'
          from pathlib import Path
          from hashlib import sha256
          import re
          for name in ('integrated-workout', 'redesign-integrated'):
              root=Path('_site')/name
              page=root/'index.html'
              html=page.read_text()
              def bust(match):
                  path=match.group(1)
                  asset=root/path
                  if not asset.is_file(): raise RuntimeError('Missing deployed asset '+str(asset))
                  return path+'?v='+sha256(asset.read_bytes()).hexdigest()[:12]
              html=re.sub(r'(?<![A-Za-z0-9_-])(?:\./)?(coach-program-builder\.js|custom-workouts\.js|app\.js|coach-migration\.css|exercise-placeholders\.css|active-exercise-guide\.css|active-exercise-guide\.js|home-rebuild\.css|workouts-tabs-n\.css|workouts-tabs-n\.js|custom-workouts\.js|progress-weekly-summary\.js|progress-weekly-summary\.css|progress-compact\.js|workout-simulation\.js|workout-simulation\.css|workout-simulation-audit\.js)\?v=\d+',bust,html)
              page.write_text(html)
          PYCACHE
          grep -Fq 'saveCoachDay' _site/redesign-integrated/custom-workouts.js
          grep -Fq 'onSaveDay:day=>' _site/redesign-integrated/app.js
          grep -Fq 'custom.find(p=>!p.coachSaved)' _site/redesign-integrated/weekly-workout-schedule.js
          touch _site/.nojekyll
          test -s _site/redesign-integrated/index.html
          test -s _site/redesign-integrated/exercise-catalog-344.js
          test -s _site/redesign-integrated/coach-program-builder.js
          test -s _site/redesign-integrated/coach-migration.js
          test -s _site/redesign-integrated/theme-option-one.css
          grep -Fq 'mlc2GuestPreviewNotice' _site/redesign-integrated/index.html
          grep -Fq 'theme-option-one.css' _site/redesign-integrated/index.html
          grep -Fq 'coach-program-builder.js' _site/redesign-integrated/index.html
          test -s _site/redesign-integrated/assets/myliftcoach-mark.svg
          test -s _site/redesign-integrated/approved-visuals-manifest.js
          test -s _site/redesign-integrated/exercise-visuals-344.js
          test -s _site/redesign-integrated/assets/exercise-demonstrations/machine-chest-press-r2.webp
          grep -Fq 'coachSaved:existing?.coachSaved===true' _site/redesign-integrated/custom-workouts.js
          grep -Fq 'View approved exercise demonstration' _site/redesign-integrated/app.js
          grep -Fq 'approvedMediaStatus' _site/redesign-integrated/index.html
          test -s _site/redesign-integrated/exercise-placeholders.css
          grep -Fq 'wrap.append(media)' _site/redesign-integrated/active-exercise-guide.js
          grep -Fq 'min-height:185px' _site/redesign-integrated/active-exercise-guide.css
          grep -Fq 'preview-exercise-picture' _site/redesign-integrated/app.js
          grep -Fq 'workout-card-illustration' _site/redesign-integrated/app.js
          grep -Fq '#home .preview-exercise-picture' _site/redesign-integrated/home-rebuild.css
          grep -Fq '#workouts .workout-card-illustration' _site/redesign-integrated/workouts-tabs-n.css
          grep -Fq 'coachSchedulePanel' _site/redesign-integrated/index.html
          grep -Fq 'window.MLC2WorkoutsSelectTab' _site/redesign-integrated/workouts-tabs-n.js
          grep -Fq 'pendingCoachScheduleOwner!==verifiedOwnerId' _site/redesign-integrated/app.js
          test -s _site/redesign-integrated/progress-weekly-summary.js
          test -s _site/redesign-integrated/progress-weekly-summary.css
          grep -Fq 'progressWeeklyComparison' _site/redesign-integrated/index.html
          grep -Fq "MLC2ProgressWeekly?.render" _site/redesign-integrated/app.js
          grep -Fq "libraryExercises().find(e=>e.id===y.exerciseId)?.name" _site/redesign-integrated/app.js
          test -s _site/redesign-integrated/workout-simulation.js
          test -s _site/redesign-integrated/workout-simulation.css
          grep -Fq 'SIMULATED TEST DATA' _site/redesign-integrated/app.js
          grep -Fq 'simulation-mode-2026-11-22' _site/redesign-integrated/index.html
          grep -Fq 'progressData.reduce((n,x)=>n+x.sets.length,0)' _site/redesign-integrated/app.js
          grep -Fq 'simulationClear' _site/redesign-integrated/index.html
          test -s _site/redesign-integrated/workout-simulation-audit.js
          grep -Fq 'simulationAudit' _site/redesign-integrated/index.html
          grep -Fq 'history2SimulationNotice' _site/redesign-integrated/index.html
          grep -Fq 'const demo=viewedHistory()' _site/redesign-integrated/app.js

          # Make Coach test page explicitly identifiable and block its production backend.
          python3 - <<'PYCOACH'
          from pathlib import Path
          root=Path('_site/coach-live-test')
          page=root/'index.html'
          html=page.read_text()
          assert 'live-coach-workout.css' in html and 'coach-migration.js' in html
          policy='<meta http-equiv="Content-Security-Policy" content="connect-src \'none\'; form-action \'none\'; frame-src \'none\'; object-src \'none\'">'
          html=html.replace('<head>','<head>\n'+policy,1)
          html=html.replace('<body>','<body>\n<div role="status" style="position:relative;z-index:99999;background:#082b31;color:#f4d69f;border-bottom:1px solid #c9a96b;padding:9px 12px;text-align:center;font:600 12px system-ui">COACH TEST · CLOUD BLOCKED · INDEPENDENT PREVIEW</div>',1)
          page.write_text(html)
          assert (root/'app.js').is_file()
          assert (root/'live-coach-workout.css').is_file()
          PYCOACH

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy-preview:
    needs: build-preview
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages preview
        uses: actions/deploy-pages@v4
        id: deploy

      - name: Verify actual integrated redesign URL
        shell: bash
        env:
          PAGES_URL: ${{ steps.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          url="${PAGES_URL%/}/redesign-integrated/"
          for attempt in 1 2 3 4 5; do
            if curl --fail --location --silent --show-error --max-time 20 --output /tmp/redesign-preview.html "${url}index.html" &&
               grep -Fq 'theme-option-one.css' /tmp/redesign-preview.html &&
               grep -Fq 'coach-program-builder.js' /tmp/redesign-preview.html &&
               grep -Fq '2.0 APPROVED TEAL REDESIGN' /tmp/redesign-preview.html &&
               grep -Fq 'simulation-mode-2026-11-22' /tmp/redesign-preview.html &&
               grep -Fq 'id="simulation30"' /tmp/redesign-preview.html &&
               grep -Eq 'coach-program-builder.js\?v=[a-f0-9]{12}' /tmp/redesign-preview.html &&
               grep -Eq 'active-exercise-guide.js\?v=[a-f0-9]{12}' /tmp/redesign-preview.html &&
               grep -Eq 'home-rebuild.css\?v=[a-f0-9]{12}' /tmp/redesign-preview.html &&
               grep -Eq 'workouts-tabs-n.css\?v=[a-f0-9]{12}' /tmp/redesign-preview.html &&
               grep -Eq 'workouts-tabs-n.js\?v=[a-f0-9]{12}' /tmp/redesign-preview.html &&
               grep -Eq 'progress-weekly-summary.js\?v=[a-f0-9]{12}' /tmp/redesign-preview.html &&
               grep -Eq 'workout-simulation.js\?v=[a-f0-9]{12}' /tmp/redesign-preview.html &&
               grep -Eq 'workout-simulation-audit.js\?v=[a-f0-9]{12}' /tmp/redesign-preview.html &&
               grep -Fq 'id="simulationAudit"' /tmp/redesign-preview.html; then
              echo "Verified integrated redesign: ${url}"
              exit 0
            fi
            echo "Integrated redesign not yet served; attempt ${attempt}/5"
            sleep 10
          done
          echo "GitHub Pages deployment did not serve the integrated redesign."
          exit 1

      - name: Verify separate Coach iPhone test URL
        shell: bash
        env:
          PAGES_URL: ${{ steps.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          url="${PAGES_URL%/}/coach-live-test/"
          for attempt in 1 2 3 4 5; do
            if curl --fail --location --silent --show-error --max-time 20 --output /tmp/coach-live-test.html "${url}index.html" &&
               grep -Fq 'live-coach-workout.css' /tmp/coach-live-test.html &&
               grep -Fq 'COACH TEST' /tmp/coach-live-test.html; then
              echo "Verified isolated Coach test: ${url}"
              exit 0
            fi
            sleep 10
          done
          echo "Isolated Coach test URL is not serving required assets."
          exit 1
