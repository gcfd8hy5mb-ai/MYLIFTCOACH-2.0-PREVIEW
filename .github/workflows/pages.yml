name: Deploy MYLIFTCOACH Preview (independent repository)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: preview-only-pages
  cancel-in-progress: false

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check independent preview safety
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s workouts-visual-preview.css
          test -s workouts-sandbox.css
          test -s workouts-sandbox.js
          test -s exercise-images.html
          test -s exercise-images.js
          test -s exercise-images.css
          test -s exercise-visuals-344-preview.html
          test -s exercise-visuals-344-preview.js
          test -s exercise-visuals-344-preview.css
          test -s exercise-visuals-344-catalog.js
          test -s exercise-visuals-344-manifest.js
          test -s exercise-guide-demo.html
          test -s exercise-guide-demo.css
          test -s exercise-guide-demo.js
          node --check exercise-guide-demo.js
          node --check exercise-visuals-344-preview.js
          node --check exercise-images.js
          node --check workouts-sandbox.js
          grep -q "connect-src 'none'" index.html
          ! grep -Ei 'localStorage|sessionStorage|indexedDB|fetch[(]|XMLHttpRequest|supabase|serviceWorker|sendBeacon' workouts-sandbox.js
          ! test -e app.js
          ! test -e sync/automatic-workouts.js
          grep -q 'Workouts Sandbox' index.html
      - name: Check out actual MYLIFTCOACH image development branch
        uses: actions/checkout@v4
        with:
          repository: gcfd8hy5mb-ai/MYLIFTCOACH-2.0
          ref: feature/344-approved-exercise-visuals
          path: source-app
          persist-credentials: false
      - name: Validate actual app image and exercise guide integration
        run: |
          set -euo pipefail
          cd source-app
          node --test tests/exercise-visuals-344.test.cjs tests/active-exercise-guide.test.cjs tests/exercise-instruction-coverage.test.cjs tests/exercise-instruction-depth.test.cjs tests/progress-compact.test.cjs tests/progress-real-volume.test.cjs tests/preview-persistence.test.cjs tests/coach-plan-preview.test.cjs
          node --check exercise-instruction-depth.js
          node --check progress-compact.js
          node --check active-exercise-guide.js
          node --check coach-plan-preview.js
          test -s assets/image-coming-approved.webp
          test -s active-exercise-guide.css
          test -s active-exercise-guide.js
          test -s approved-visuals-manifest.js
      - name: Package preview-only website
        run: |
          set -euo pipefail
          mkdir -p _site/assets
          cp index.html workouts-visual-preview.css workouts-sandbox.css workouts-sandbox.js _site/
          cp exercise-images.html exercise-images.js exercise-images.css _site/
          cp exercise-visuals-344-preview.html exercise-visuals-344-preview.js exercise-visuals-344-preview.css exercise-visuals-344-catalog.js exercise-visuals-344-manifest.js _site/
          cp exercise-guide-demo.html exercise-guide-demo.css exercise-guide-demo.js _site/
          mkdir -p _site/images
          cp images/*.png _site/images/
          test "$(find _site/images -name '*.png' | wc -l)" -eq 14
          cp assets/approved-vertical-marble-sharp.webp _site/assets/
          # Copy the actual source branch into a separate, non-live preview path.
          # Exclude repository metadata and automation files.
          mkdir -p _site/integrated-workout
          rsync -a --exclude=.git --exclude=.github --exclude=tests --exclude=preview --exclude=standalone-preview-template --exclude=node_modules source-app/ _site/integrated-workout/
          cp preview-guest-backup.js _site/integrated-workout/
          node --check preview-guest-backup.js
          grep -Fq 'Test saving across visits' preview-guest-backup.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('_site/integrated-workout/index.html')
          s=p.read_text()
          assert '<head>' in s and '</body>' in s
          csp = """<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'none'; frame-src 'none'; form-action 'none'; object-src 'none'; base-uri 'none'">"""
          s=s.replace('<head>','<head>\n'+csp,1)
          # Cache-bust corrected CSS and instruction alias mapping on iPhone Safari.
          import re
          from hashlib import sha256
          def bust(m):
              asset=m.group(1)
              file=Path('_site/integrated-workout')/asset
              if not file.exists(): return m.group(0)
              stamp=sha256(file.read_bytes()).hexdigest()[:12]
              return f'{asset}?v={stamp}'
          s=re.sub(r'(workouts-tabs-n\.css|exercise-instruction-coverage\.js|progress-compact\.css|progress-compact\.js|progress-migration\.js|workout-active-ux\.js|coach-migration\.css|coach-plan-preview\.js|coach-readiness\.js|app\.js)\?v=\d+',bust,s)

          banner = """<aside style="position:relative;z-index:99999;background:#092d30;color:#f9d9a0;border-bottom:1px solid #c3a76f;padding:8px 13px;text-align:center;font:600 12px system-ui">TEST BUILD · PROGRESS TABS V2 · Local Safari demo storage only. Live app unchanged.</aside>"""
          s=s.replace('<body>','<body>\n'+banner+'\n<section id="mlc-preview-persistence" style="position:relative;z-index:99999;background:#072e33;padding:12px;text-align:center;border-bottom:1px solid #9c865b"></section>',1)
          s=s.replace('</body>','<script defer src="./preview-guest-backup.js?v=2"></script>\n</body>',1)
          p.write_text(s)
          PY
          grep -q "connect-src 'none'" _site/integrated-workout/index.html
          test -s _site/integrated-workout/assets/image-coming-approved.webp
          test -s _site/integrated-workout/active-exercise-guide.js
          test -s _site/integrated-workout/approved-visuals-manifest.js
          test -s _site/integrated-workout/exercise-instruction-coverage.js
          test -s _site/integrated-workout/exercise-instruction-depth.js
          test -s _site/integrated-workout/progress-compact.js
          test -s _site/integrated-workout/coach-plan-preview.js
          grep -Fq 'coachPlanPreview' _site/integrated-workout/index.html
          grep -Fq 'Open selected workout' _site/integrated-workout/coach-plan-preview.js
          grep -Fq "typeof onChange==='function'" _site/integrated-workout/coach-readiness.js
          grep -Eq 'coach-plan-preview.js\?v=[a-f0-9]{12}' _site/integrated-workout/index.html
          grep -Eq 'coach-readiness.js\?v=[a-f0-9]{12}' _site/integrated-workout/index.html
          test -s _site/integrated-workout/progress-compact.css
          test -s _site/integrated-workout/preview-guest-backup.js
          grep -Fq 'Test saving across visits' _site/integrated-workout/preview-guest-backup.js
          grep -q 'mlc-preview-persistence' _site/integrated-workout/index.html
          grep -q 'training volume' _site/integrated-workout/progress-migration.js
          grep -q "source:'empty'" _site/integrated-workout/workout-active-ux.js
          grep -q 'volumeTotal(x.sets)' _site/integrated-workout/app.js
          grep -q 'renderVolumeAudit' _site/integrated-workout/progress-migration.js
          grep -q 'progressVolumeAudit' _site/integrated-workout/progress-compact.js
          grep -q 'groups.strength.prepend(auditCard)' _site/integrated-workout/progress-compact.js
          grep -Eq 'progress-migration.js\?v=[a-f0-9]{12}' _site/integrated-workout/index.html
          grep -Eq 'workout-active-ux.js\?v=[a-f0-9]{12}' _site/integrated-workout/index.html
          grep -Eq 'app.js\?v=[a-f0-9]{12}' _site/integrated-workout/index.html
          grep -q 'recent-item:nth-child(n+6)' _site/integrated-workout/progress-compact.css
          grep -q "progress-compact.js" _site/integrated-workout/index.html
          grep -Eq 'progress-compact.js\?v=[a-f0-9]{12}' _site/integrated-workout/index.html
          grep -Eq 'progress-compact.css\?v=[a-f0-9]{12}' _site/integrated-workout/index.html
          grep -q 'background:#04252d!important' _site/integrated-workout/workouts-tabs-n.css
          grep -q 'const groups=new Map()' _site/integrated-workout/exercise-instruction-coverage.js
          grep -q 'exercise-instruction-coverage.js?v=' _site/integrated-workout/index.html

          touch _site/.nojekyll
      - name: Upload exact Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: _site

  deploy-preview:
    needs: build-preview
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy verified preview artifact
        uses: actions/deploy-pages@v4
        id: deploy
        with:
          artifact_name: github-pages
      - name: Verify Preview page after deployment
        env:
          PAGES_URL: ${{ steps.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          url="${PAGES_URL%/}/"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          # Download to disk before inspecting. Piping curl into grep -q
          # closes stdout early and triggers curl 23 under pipefail.
          for i in 1 2 3 4 5; do
            success=true
            for file in index.html exercise-guide-demo.html exercise-guide-demo.js integrated-workout/index.html integrated-workout/active-exercise-guide.js integrated-workout/workouts-tabs-n.css integrated-workout/exercise-instruction-coverage.js integrated-workout/exercise-instruction-depth.js integrated-workout/progress-compact.js integrated-workout/progress-compact.css integrated-workout/preview-guest-backup.js integrated-workout/coach-plan-preview.js integrated-workout/coach-readiness.js integrated-workout/progress-migration.js integrated-workout/workout-active-ux.js integrated-workout/app.js; do
              if ! curl --fail --location --silent --show-error --max-time 25 --output "$tmp/${file//\//_}" "${url}${file}"; then
                echo "Could not fetch ${file} on attempt ${i}"
                success=false
                break
              fi
            done
            if [ "$success" = true ] \
              && grep -Fq 'Workouts Sandbox' "$tmp/index.html" \
              && grep -Fq 'Quick Exercise Guide' "$tmp/exercise-guide-demo.html" \
              && grep -Fq 'MLC2_EXERCISE_CATALOG' "$tmp/exercise-guide-demo.js" \
              && grep -Fq 'PROGRESS TABS V2' "$tmp/integrated-workout_index.html" \
              && grep -Fq 'View Full Guide' "$tmp/integrated-workout_active-exercise-guide.js" \
              && grep -Fq 'background:#04252d!important' "$tmp/integrated-workout_workouts-tabs-n.css" \
              && grep -Fq 'const groups=new Map()' "$tmp/integrated-workout_exercise-instruction-coverage.js" \
              && grep -Fq 'revisions.length!==92' "$tmp/integrated-workout_exercise-instruction-depth.js" \
              && grep -Fq 'progress-compact-tabs' "$tmp/integrated-workout_progress-compact.js" \
              && grep -Fq 'progress-compact-panel' "$tmp/integrated-workout_progress-compact.css" \
              && grep -Fq 'sum of weight × reps from your completed sets' "$tmp/integrated-workout_progress-migration.js" \
              && grep -Fq "source:'empty'" "$tmp/integrated-workout_workout-active-ux.js" \
              && grep -Fq 'volumeTotal(x.sets)' "$tmp/integrated-workout_app.js" \
              && grep -Fq 'function renderVolumeAudit(' "$tmp/integrated-workout_progress-migration.js" \
              && grep -Fq 'Save demo backup' "$tmp/integrated-workout_preview-guest-backup.js" \
              && grep -Fq 'Test saving across visits' "$tmp/integrated-workout_preview-guest-backup.js" \
              && grep -Fq 'Open selected workout' "$tmp/integrated-workout_coach-plan-preview.js" \
              && grep -Fq "typeof onChange==='function'" "$tmp/integrated-workout_coach-readiness.js"; then
              echo "Published integrated Progress V2 and exercise guide verified: ${url}integrated-workout/"
              exit 0
            fi
            echo "Published files still refreshing or not yet valid (attempt ${i}/5)"
            sleep 10
          done
          echo 'Post-deployment verification failed. Published website may exist; inspect individual downloads above.'
          exit 1
