name: Deploy MYLIFTCOACH Preview (independent repository)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: preview-only-pages
  cancel-in-progress: false

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check independent preview safety
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s workouts-visual-preview.css
          test -s workouts-sandbox.css
          test -s workouts-sandbox.js
          test -s exercise-images.html
          test -s exercise-images.js
          test -s exercise-images.css
          test -s exercise-visuals-344-preview.html
          test -s exercise-visuals-344-preview.js
          test -s exercise-visuals-344-preview.css
          test -s exercise-visuals-344-catalog.js
          test -s exercise-visuals-344-manifest.js
          test -s exercise-guide-demo.html
          test -s exercise-guide-demo.css
          test -s exercise-guide-demo.js
          node --check exercise-guide-demo.js
          node --check exercise-visuals-344-preview.js
          node --check exercise-images.js
          node --check workouts-sandbox.js
          grep -q "connect-src 'none'" index.html
          ! grep -Ei 'localStorage|sessionStorage|indexedDB|fetch[(]|XMLHttpRequest|supabase|serviceWorker|sendBeacon' workouts-sandbox.js
          ! test -e app.js
          ! test -e sync/automatic-workouts.js
          grep -q 'Workouts Sandbox' index.html
      - name: Check out actual MYLIFTCOACH image development branch
        uses: actions/checkout@v4
        with:
          repository: gcfd8hy5mb-ai/MYLIFTCOACH-2.0
          ref: feature/344-approved-exercise-visuals
          path: source-app
          persist-credentials: false
      - name: Validate actual app image and exercise guide integration
        run: |
          set -euo pipefail
          cd source-app
          node --test tests/exercise-visuals-344.test.cjs tests/active-exercise-guide.test.cjs tests/exercise-instruction-coverage.test.cjs tests/exercise-instruction-depth.test.cjs
          test -s assets/image-coming-approved.webp
          test -s active-exercise-guide.css
          test -s active-exercise-guide.js
          test -s approved-visuals-manifest.js
      - name: Package preview-only website
        run: |
          set -euo pipefail
          mkdir -p _site/assets
          cp index.html workouts-visual-preview.css workouts-sandbox.css workouts-sandbox.js _site/
          cp exercise-images.html exercise-images.js exercise-images.css _site/
          cp exercise-visuals-344-preview.html exercise-visuals-344-preview.js exercise-visuals-344-preview.css exercise-visuals-344-catalog.js exercise-visuals-344-manifest.js _site/
          cp exercise-guide-demo.html exercise-guide-demo.css exercise-guide-demo.js _site/
          mkdir -p _site/images
          cp images/*.png _site/images/
          test "$(find _site/images -name '*.png' | wc -l)" -eq 14
          cp assets/approved-vertical-marble-sharp.webp _site/assets/
          # Copy the actual source branch into a separate, non-live preview path.
          # Exclude repository metadata and automation files.
          mkdir -p _site/integrated-workout
          rsync -a --exclude=.git --exclude=.github --exclude=tests --exclude=preview --exclude=standalone-preview-template --exclude=node_modules source-app/ _site/integrated-workout/
          python3 - <<'PY'
          from pathlib import Path
          p=Path('_site/integrated-workout/index.html')
          s=p.read_text()
          assert '<head>' in s and '</body>' in s
          csp = """<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'none'; frame-src 'none'; form-action 'none'; object-src 'none'; base-uri 'none'">"""
          s=s.replace('<head>','<head>\n'+csp,1)
          # Cache-bust corrected CSS and instruction alias mapping on iPhone Safari.
          import re
          from hashlib import sha256
          def bust(m):
              asset=m.group(1)
              file=Path('_site/integrated-workout')/asset
              if not file.exists(): return m.group(0)
              stamp=sha256(file.read_bytes()).hexdigest()[:12]
              return f'{asset}?v={stamp}'
          s=re.sub(r'(workouts-tabs-n\.css|exercise-instruction-coverage\.js)\?v=\d+',bust,s)

          banner = """<aside style="position:relative;z-index:99999;background:#092d30;color:#f9d9a0;border-bottom:1px solid #c3a76f;padding:8px 13px;text-align:center;font:600 12px system-ui">TEST BUILD · No cloud connections. Use demo workouts only. Changes here do not affect your live app.</aside>"""
          s=s.replace('<body>','<body>\n'+banner,1)
          p.write_text(s)
          PY
          grep -q "connect-src 'none'" _site/integrated-workout/index.html
          test -s _site/integrated-workout/assets/image-coming-approved.webp
          test -s _site/integrated-workout/active-exercise-guide.js
          test -s _site/integrated-workout/approved-visuals-manifest.js
          test -s _site/integrated-workout/exercise-instruction-coverage.js
          test -s _site/integrated-workout/exercise-instruction-depth.js
          grep -q 'background:#04252d!important' _site/integrated-workout/workouts-tabs-n.css
          grep -q 'const groups=new Map()' _site/integrated-workout/exercise-instruction-coverage.js
          grep -q 'exercise-instruction-coverage.js?v=' _site/integrated-workout/index.html

          touch _site/.nojekyll
      - name: Upload exact Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: _site

  deploy-preview:
    needs: build-preview
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy verified preview artifact
        uses: actions/deploy-pages@v4
        id: deploy
        with:
          artifact_name: github-pages
      - name: Verify Preview page after deployment
        env:
          PAGES_URL: ${{ steps.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          url="${PAGES_URL%/}/"
          for i in 1 2 3 4 5; do
            if curl --fail --silent --show-error --max-time 10 "$url" | grep -q 'Workouts Sandbox' \
              && curl --fail --silent --show-error --max-time 10 "${url}exercise-guide-demo.html" | grep -q 'Quick Exercise Guide' \
              && curl --fail --silent --show-error --max-time 10 "${url}exercise-guide-demo.js" | grep -q 'MLC2_EXERCISE_CATALOG' \
              && curl --fail --silent --show-error --max-time 10 "${url}integrated-workout/index.html" | grep -q 'TEST BUILD' \
              && curl --fail --silent --show-error --max-time 10 "${url}integrated-workout/active-exercise-guide.js" | grep -q 'View Full Guide' \
              && curl --fail --silent --show-error --max-time 10 "${url}integrated-workout/workouts-tabs-n.css" | grep -q 'background:#04252d!important' \
              && curl --fail --silent --show-error --max-time 10 "${url}integrated-workout/exercise-instruction-coverage.js" | grep -q 'const groups=new Map()' \
              && curl --fail --silent --show-error --max-time 10 "${url}integrated-workout/exercise-instruction-depth.js" | grep -q 'revisions.length!==92'; then
              echo "Independent preview and interactive guide verified: $url"
              exit 0
            fi
            sleep 10
          done
          echo 'Expected interactive exercise guide not available in published Pages output.'
          exit 1
