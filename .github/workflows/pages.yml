name: Deploy MYLIFTCOACH Preview (GitHub Pages only)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: preview-only-pages
  cancel-in-progress: false

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Check out independent preview site
        uses: actions/checkout@v4

      - name: Check out 2.0 development source
        uses: actions/checkout@v4
        with:
          repository: gcfd8hy5mb-ai/MYLIFTCOACH-2.0
          ref: feature/344-approved-exercise-visuals
          path: source-app
          persist-credentials: false

      - name: Validate actual approved teal redesign source
        shell: bash
        run: |
          set -euo pipefail
          cd source-app
          test -s index.html
          test -s theme-option-one.css
          test -s coach-program-builder.js
          test -s exercise-catalog-344.js
          test -s assets/myliftcoach-mark.svg
          node --check coach-program-builder.js
          node --check app.js
          grep -Fq 'theme-option-one.css' index.html
          grep -Fq 'coach-program-builder.js' index.html
          grep -Fq 'id="coaching"' index.html

      - name: Package independent test sites without publishing the live app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/integrated-workout _site/redesign-integrated
          # Keep all pre-existing independent preview pages working.
          rsync -a --exclude=.git --exclude=.github --exclude=_site --exclude=source-app --exclude=redesign-app --exclude=node_modules ./ _site/
          rsync -a --exclude=.git --exclude=.github --exclude=tests --exclude=node_modules source-app/ _site/integrated-workout/
          # The approved dark-teal marble redesign is the MYLIFTCOACH-2.0
          # source app. The workout-tracker branch is the old purple UI and
          # must not be used as the visual foundation for this preview.
          rsync -a --exclude=.git --exclude=.github --exclude=tests --exclude=node_modules source-app/ _site/redesign-integrated/

          # The preview domain has no cloud access, so it cannot modify the
          # live app's Supabase records. Original GitHub Pages is untouched.
          python3 - <<'PY'
          from pathlib import Path
          for name in ('integrated-workout', 'redesign-integrated'):
              page=Path('_site')/name/'index.html'
              html=page.read_text()
              assert '<head>' in html
              policy='<meta http-equiv="Content-Security-Policy" content="connect-src \'none\'; frame-src \'none\'; form-action \'none\'; object-src \'none\'">'
              html=html.replace('<head>','<head>\n'+policy,1)
              if name=='redesign-integrated':
                  assert 'theme-option-one.css' in html
                  assert 'coach-program-builder.js' in html
                  assert 'id="coaching"' in html
                  html=html.replace('<body>','<body>\n<div id="mlc2GuestPreviewNotice" style="position:relative;z-index:99998;background:#082b31;color:#f4d69f;border-bottom:1px solid #c9a96b;padding:9px 12px;text-align:center;font:600 12px system-ui">2.0 APPROVED TEAL REDESIGN · TEST BUILD · CLOUD DISABLED</div>',1)
              page.write_text(html)
          PY
          touch _site/.nojekyll
          test -s _site/redesign-integrated/index.html
          test -s _site/redesign-integrated/exercise-catalog-344.js
          test -s _site/redesign-integrated/coach-program-builder.js
          test -s _site/redesign-integrated/coach-migration.js
          test -s _site/redesign-integrated/theme-option-one.css
          grep -Fq 'mlc2GuestPreviewNotice' _site/redesign-integrated/index.html
          grep -Fq 'theme-option-one.css' _site/redesign-integrated/index.html
          grep -Fq 'coach-program-builder.js' _site/redesign-integrated/index.html
          test -s _site/redesign-integrated/assets/myliftcoach-mark.svg

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy-preview:
    needs: build-preview
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages preview
        uses: actions/deploy-pages@v4
        id: deploy

      - name: Verify actual integrated redesign URL
        shell: bash
        env:
          PAGES_URL: ${{ steps.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          url="${PAGES_URL%/}/redesign-integrated/"
          for attempt in 1 2 3 4 5; do
            if curl --fail --location --silent --show-error --max-time 20 --output /tmp/redesign-preview.html "${url}index.html" &&
               grep -Fq 'theme-option-one.css' /tmp/redesign-preview.html &&
               grep -Fq 'coach-program-builder.js' /tmp/redesign-preview.html &&
               grep -Fq '2.0 APPROVED TEAL REDESIGN' /tmp/redesign-preview.html; then
              echo "Verified integrated redesign: ${url}"
              exit 0
            fi
            echo "Integrated redesign not yet served; attempt ${attempt}/5"
            sleep 10
          done
          echo "GitHub Pages deployment did not serve the integrated redesign."
          exit 1
