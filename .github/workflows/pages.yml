name: Deploy MYLIFTCOACH Preview (GitHub Pages only)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: preview-only-pages
  cancel-in-progress: false

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Check out independent preview site
        uses: actions/checkout@v4

      - name: Check out 2.0 development source
        uses: actions/checkout@v4
        with:
          repository: gcfd8hy5mb-ai/MYLIFTCOACH-2.0
          ref: feature/344-approved-exercise-visuals
          path: source-app
          persist-credentials: false

      - name: Check out approved redesign integration branch
        uses: actions/checkout@v4
        with:
          repository: gcfd8hy5mb-ai/workout-tracker
          ref: feature/myliftcoach2-full-integration
          path: redesign-app
          persist-credentials: false

      - name: Validate redesign-only integration
        shell: bash
        run: |
          set -euo pipefail
          cd redesign-app
          node --test tests/mlc2-redesign-integration.test.cjs
          node --check integrations/mlc2/redesign-bridge.js
          node --check integrations/mlc2/coach-program-builder.js
          test -s index.html
          test -s integrations/mlc2/exercise-catalog-344.js
          test -s integrations/mlc2/redesign-bridge.css
          grep -Fq 'id="mlc2IntegrationScreen"' index.html
          grep -Fq 'mlc2ExerciseSearch' index.html
          cd ..
          test -s source-app/index.html
          test -s index.html

      - name: Package independent test sites without publishing the live app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/integrated-workout _site/redesign-integrated
          # Keep all pre-existing independent preview pages working.
          rsync -a --exclude=.git --exclude=.github --exclude=_site --exclude=source-app --exclude=redesign-app --exclude=node_modules ./ _site/
          rsync -a --exclude=.git --exclude=.github --exclude=tests --exclude=node_modules source-app/ _site/integrated-workout/
          rsync -a --exclude=.git --exclude=.github --exclude=tests --exclude=node_modules redesign-app/ _site/redesign-integrated/

          # The preview domain has no cloud access, so it cannot modify the
          # live app's Supabase records. Original GitHub Pages is untouched.
          python3 - <<'PY'
          from pathlib import Path
          for name in ('integrated-workout', 'redesign-integrated'):
              page=Path('_site')/name/'index.html'
              html=page.read_text()
              assert '<head>' in html
              policy='<meta http-equiv="Content-Security-Policy" content="connect-src \'none\'; frame-src \'none\'; form-action \'none\'; object-src \'none\'">'
              html=html.replace('<head>','<head>\n'+policy,1)
              if name=='redesign-integrated':
                  assert 'mlc2IntegrationScreen' in html
                  assert 'mlc2ExerciseSearch' in html
                  html=html.replace('<body>','<body>\n<div id="mlc2GuestPreviewNotice" style="position:relative;z-index:99998;background:#082b31;color:#f4d69f;border-bottom:1px solid #c9a96b;padding:9px 12px;text-align:center;font:600 12px system-ui">2.0 REDESIGN TEST · GUEST INSPECTION · NO CLOUD CONNECTION</div>',1)
              page.write_text(html)
          PY
          # This isolated test origin has no cloud access. Prevent the copied
          # production login gate from blocking guest-only visual inspection.
          # Never change the original redesign branch's account-ui.js.
          python3 - <<'PYAUTHPREVIEW'
          from pathlib import Path
          p=Path('_site/redesign-integrated/persistence/account-ui.js')
          src=p.read_text()
          old="if(!manager.owner){showAuthGate();document.documentElement.classList.remove('prism-account-booting');return;}"
          replacement="if(!manager.owner){document.documentElement.classList.remove('prism-account-booting');return;}"
          assert src.count(old)==1, 'Preview auth gate marker changed: abort rather than weaken login unexpectedly'
          p.write_text(src.replace(old,replacement,1))
          assert 'showAuthGate();document.documentElement' not in p.read_text()
          PYAUTHPREVIEW
          touch _site/.nojekyll
          test -s _site/redesign-integrated/index.html
          test -s _site/redesign-integrated/integrations/mlc2/redesign-bridge.js
          test -s _site/redesign-integrated/integrations/mlc2/exercise-catalog-344.js
          test -s _site/redesign-integrated/integrations/mlc2/coach-program-builder.js
          grep -Fq 'mlc2GuestPreviewNotice' _site/redesign-integrated/index.html
          ! grep -Fq "if(!manager.owner){showAuthGate();" _site/redesign-integrated/persistence/account-ui.js

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy-preview:
    needs: build-preview
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages preview
        uses: actions/deploy-pages@v4
        id: deploy

      - name: Verify actual integrated redesign URL
        shell: bash
        env:
          PAGES_URL: ${{ steps.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          url="${PAGES_URL%/}/redesign-integrated/"
          for attempt in 1 2 3 4 5; do
            if curl --fail --location --silent --show-error --max-time 20 --output /tmp/redesign-preview.html "${url}index.html" &&
               grep -Fq 'mlc2IntegrationScreen' /tmp/redesign-preview.html &&
               grep -Fq 'mlc2ExerciseSearch' /tmp/redesign-preview.html &&
               grep -Fq 'mlc2GuestPreviewNotice' /tmp/redesign-preview.html; then
              echo "Verified integrated redesign: ${url}"
              exit 0
            fi
            echo "Integrated redesign not yet served; attempt ${attempt}/5"
            sleep 10
          done
          echo "GitHub Pages deployment did not serve the integrated redesign."
          exit 1
